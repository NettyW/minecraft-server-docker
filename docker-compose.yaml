services:
  minecraft-server:
    image: itzg/minecraft-server:java17
    container_name: minecraft-server-spellnomia
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "FORGE"
      VERSION: "1.20.1"
      FORGE_VERSION: "47.4.16"
      MEMORY: "5G"

      ENABLE_RCON: "true"
      RCON_PASSWORD: "1234"
      RCON_PORT: "25575"
      SERVER_PORT: "25565"

    volumes:
      - ./minecraft-data-spellnomia:/data

    networks:
      - minecraft-network
    restart: always

  rcon:
    image: outdead/rcon:latest
    command: /bin/sh -c "tail -f README.md"
    networks:
      - minecraft-network
    restart: always
    container_name: rcon-minecraft

networks:
  minecraft-network:
    driver: bridge
